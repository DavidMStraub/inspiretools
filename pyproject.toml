[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "inspiretools"
dynamic = ["version"]
description = "Python package to auto-generate bibliographies pulling the bibtex data from Inspire"
readme = "README.md"
license = "MIT"
authors = [{ name = "David M. Straub" }]
requires-python = ">=3.8"
dependencies = ["requests"]

[project.urls]
Homepage = "https://github.com/DavidMStraub/inspire-tools"

[project.scripts]
auxtobib = "inspiretools:aux2bib"
blgtobib = "inspiretools:blg2bib"

[tool.setuptools]
packages = ["inspiretools"]

[tool.setuptools_scm]
